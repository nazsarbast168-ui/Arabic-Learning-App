<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arabic Learning App - Naz Sarbast</title>

  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --btn-color: #27ae60;
      --btn-text: #ffffff;
      --border-color: #e0e0e0;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      --app-font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Traditional Arabic', 'Cairo', sans-serif;
    }

    body.dark-mode {
      --bg-color: #1a1a2e;
      --card-bg: #16213e;
      --text-color: #f1f1f1;
      --border-color: #0f3460;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--app-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .custom-btn {
      background-color: var(--btn-color);
      color: var(--btn-text);
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, opacity 0.2s ease, background-color 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .custom-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .custom-btn:active {
      transform: translateY(0);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      position: relative;
      z-index: 100;
    }

    .theme-btn, .settings-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .settings-container {
      position: relative;
    }

    .settings-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 55px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      width: 250px;
      z-index: 200;
      flex-direction: column;
      gap: 15px;
    }

    .settings-menu.active {
      display: flex;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-item label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .setting-item input[type="color"],
    .setting-item select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
    }

    .landing-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      text-align: center;
      padding: 20px;
    }

    .landing-screen h1 {
      font-size: 2.2rem;
      margin-bottom: 25px;
    }

    .dashboard-screen {
      display: none;
      flex-direction: column;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      flex-grow: 1;
    }

    .dashboard-screen.active {
      display: flex;
    }

    .section-title {
      font-size: 1.4rem;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .word-grid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-item:hover {
      transform: translateY(-4px);
      border-color: var(--btn-color);
    }

    .card-item .arabic-text {
      font-size: 2rem;
      font-weight: 700;
    }

    .card-item .sub-text {
      font-size: 0.8rem;
      margin-top: 4px;
      opacity: 0.8;
    }

    .typing-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .typing-input-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .typing-input {
      flex: 1;
      padding: 12px;
      font-size: 1.3rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      direction: rtl;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-weight: 600;
      font-size: 1.1rem;
      border-top: 1px solid var(--border-color);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <button class="theme-btn" id="themeBtn" title="Toggle Theme">
      <svg class="icon" viewBox="0 0 24 24" id="themeIcon">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="settings-container">
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"></path>
        </svg>
      </button>
      
      <div class="settings-menu" id="settingsMenu">
        <div class="setting-item">
          <label for="bgColorPicker" id="lblBgColor">Background Color</label>
          <input type="color" id="bgColorPicker" value="#f4f7f6">
        </div>
        <div class="setting-item">
          <label for="btnColorPicker" id="lblBtnColor">Button Color</label>
          <input type="color" id="btnColorPicker" value="#27ae60">
        </div>
        <div class="setting-item">
          <label for="langSelect" id="lblLang">Language</label>
          <select id="langSelect">
            <option value="en">English</option>
            <option value="ku">Kurdî (Kurdish)</option>
            <option value="ar">العربية (Arabic)</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="landing-screen" id="landingScreen">
    <h1 id="welcomeText">please you can start</h1>
    <button class="custom-btn" id="startBtn">
      <span id="startBtnText">Start</span>
      <svg class="icon" viewBox="0 0 24 24" style="fill:none; stroke:currentColor; stroke-width:2;">
        <path d="M5 12h14M12 5l7 7-7 7"></path>
      </svg>
    </button>
  </main>

  <div class="dashboard-screen" id="dashboardScreen">
    <section>
      <h2 class="section-title">
        <span id="titleLetters">Arabic Letters</span>
      </h2>
      <div class="grid-container" id="lettersContainer"></div>
    </section>

    <section class="typing-section">
      <h2 class="section-title">
        <span id="titleTyping">Type Letters Practice</span>
      </h2>
      <p id="descTyping" style="opacity: 0.8; font-size: 0.9rem; margin-top: 5px;">Type any Arabic text below and click play to hear it:</p>
      <div class="typing-input-container">
        <input type="text" class="typing-input" id="typingInput" placeholder="اكتب هنا..." dir="rtl">
        <button class="custom-btn" id="speakTypeBtn">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
          </svg>
        </button>
      </div>
    </section>

    <section>
      <h2 class="section-title">
        <span id="titleWords">Vocabulary Library</span>
      </h2>
      <div class="grid-container word-grid" id="wordsContainer"></div>
    </section>
  </div>

  <footer>
    <span id="footerText">Naz Sarbast</span>
  </footer>

  <script>
    const arabicAlphabet = [
      { char: 'أ', name: 'Alif' }, { char: 'ب', name: 'Baa' }, { char: 'ت', name: 'Taa' },
      { char: 'ث', name: 'Thaa' }, { char: 'ج', name: 'Jeem' }, { char: 'ح', name: 'Haa' },
      { char: 'خ', name: 'Khaa' }, { char: 'د', name: 'Dal' }, { char: 'ذ', name: 'Dhal' },
      { char: 'ر', name: 'Raa' }, { char: 'ز', name: 'Zaay' }, { char: 'س', name: 'Seen' },
      { char: 'ش', name: 'Sheen' }, { char: 'ص', name: 'Saad' }, { char: 'ض', name: 'Daad' },
      { char: 'ط', name: 'Taa' }, { char: 'ظ', name: 'Dhaa' }, { char: 'ع', name: 'Ayn' },
      { char: 'غ', name: 'Ghayn' }, { char: 'ف', name: 'Faa' }, { char: 'ق', name: 'Qaaf' },
      { char: 'ك', name: 'Kaaf' }, { char: 'ل', name: 'Laam' }, { char: 'م', name: 'Meem' },
      { char: 'ن', name: 'Noon' }, { char: 'هـ', name: 'Haa' }, { char: 'و', name: 'Waw' },
      { char: 'ي', name: 'Yaa' }
    ];

    const vocabularyList = [
      { ar: 'مَرْحَبًا', en: 'Hello', ku: 'سڵاو' },
      { ar: 'شُكْرًا', en: 'Thank you', ku: 'سوپاس' },
      { ar: 'كِتَاب', en: 'Book', ku: 'پرتووک' },
      { ar: 'قَلَم', en: 'Pen', ku: 'پێنووس' },
      { ar: 'مَدْرَسَة', en: 'School', ku: 'قوتابخانە' },
      { ar: 'بَيْت', en: 'House', ku: 'ماڵ' },
      { ar: 'مَاء', en: 'Water', ku: 'ئاو' },
      { ar: 'شَمْس', en: 'Sun', ku: 'خۆر' },
      { ar: 'قَمَر', en: 'Moon', ku: 'مانگ' },
      { ar: 'شَجَرَة', en: 'Tree', ku: 'دار' },
      { ar: 'زَهْرَة', en: 'Flower', ku: 'گوڵ' },
      { ar: 'سَيَّارَة', en: 'Car', ku: 'ئۆتۆمبێل' },
      { ar: 'طَائِرَة', en: 'Airplane', ku: 'فڕۆکە' },
      { ar: 'صَدِيق', en: 'Friend', ku: 'هاوڕێ' },
      { ar: 'عَائِلَة', en: 'Family', ku: 'خێزان' },
      { ar: 'طَعَام', en: 'Food', ku: 'خواردن' },
      { ar: 'قَهْوَة', en: 'Coffee', ku: 'قاوە' },
      { ar: 'شَاي', en: 'Tea', ku: 'چا' },
      { ar: 'نَار', en: 'Fire', ku: 'ئاگر' },
      { ar: 'أَرْض', en: 'Earth', ku: 'زەوی' },
      { ar: 'سَمَاء', en: 'Sky', ku: 'ئاسمان' },
      { ar: 'بَحْر', en: 'Sea', ku: 'دەریا' },
      { ar: 'جَبَل', en: 'Mountain', ku: 'کێو' },
      { ar: 'نَهْر', en: 'River', ku: 'ڕووبار' },
      { ar: 'مَلِك', en: 'King', ku: 'پاشا' },
      { ar: 'يَوْم', en: 'Day', ku: 'ڕۆژ' },
      { ar: 'لَيْل', en: 'Night', ku: 'شەو' },
      { ar: 'نُور', en: 'Light', ku: 'ڕووناکی' }
    ];

    const translations = {
      en: {
        welcome: "please you can start",
        startBtn: "Start",
        lblBgColor: "Background Color",
        lblBtnColor: "Button Color",
        lblLang: "Language",
        titleLetters: "Arabic Letters",
        titleTyping: "Type Letters Practice",
        descTyping: "Type any Arabic text below and click play to hear it:",
        titleWords: "Vocabulary Library",
        footer: "Naz Sarbast"
      },
      ku: {
        welcome: "تکایە دەتوانی دەستپێبکەیت",
        startBtn: "دەستپێکردن",
        lblBgColor: "ڕەنگی پاشبنەما",
        lblBtnColor: "ڕەنگی دوگمە",
        lblLang: "زمان",
        titleLetters: "پیتە عەرەبییەکان",
        titleTyping: "ڕاهێنانی نووسینی پیتەکان",
        descTyping: "دەقێکی عەرەبی بنووسە بۆ بیستنی دەنگەکەی:",
        titleWords: "فەرهەنگی وشەکان",
        footer: "Naz Sarbast"
      },
      ar: {
        welcome: "رجاءً يمكنك البدء",
        startBtn: "ابدأ",
        lblBgColor: "لون الخلفية",
        lblBtnColor: "لون الأزرار",
        lblLang: "اللغة",
        titleLetters: "الحروف العربية",
        titleTyping: "قسم كتابة الحروف",
        descTyping: "اكتب أي نص عربي واضغط على الزر لسماعه:",
        titleWords: "مكتبة الكلمات",
        footer: "Naz Sarbast"
      }
    };

    let currentLang = 'en';

    const themeBtn = document.getElementById('themeBtn');
    const themeIcon = document.getElementById('themeIcon');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const btnColorPicker = document.getElementById('btnColorPicker');
    const langSelect = document.getElementById('langSelect');
    const landingScreen = document.getElementById('landingScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const startBtn = document.getElementById('startBtn');
    const lettersContainer = document.getElementById('lettersContainer');
    const wordsContainer = document.getElementById('wordsContainer');
    const typingInput = document.getElementById('typingInput');
    const speakTypeBtn = document.getElementById('speakTypeBtn');

    // Create a global Audio instance to handle cross-origin TTS audio reliably
    const audioPlayer = new Audio();

    // Universal Audio API: Falls back to Google Translate Audio Engine
    function playAudio(text) {
      if (!text || text.trim() === '') return;
      
      const cleanText = text.trim();
      const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=ar&client=tw-ob`;

      audioPlayer.src = googleTtsUrl;
      audioPlayer.play().catch(err => {
        // Fallback to native speech synthesis if network is offline or blocked
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'ar-SA';
          window.speechSynthesis.speak(utterance);
        }
      });
    }

    function renderLetters() {
      lettersContainer.innerHTML = '';
      arabicAlphabet.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="arabic-text">${item.char}</div>
          <div class="sub-text">${item.name}</div>
        `;
        card.addEventListener('click', () => playAudio(item.char));
        lettersContainer.appendChild(card);
      });
    }

    function renderWords() {
      wordsContainer.innerHTML = '';
      vocabularyList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-item';
        const sub = currentLang === 'ku' ? item.ku : item.en;
        card.innerHTML = `
          <div class="arabic-text">${item.ar}</div>
          <div class="sub-text">${sub}</div>
        `;
        card.addEventListener('click', () => playAudio(item.ar));
        wordsContainer.appendChild(card);
      });
    }

    function updateLanguage(lang) {
      currentLang = lang;
      const t = translations[lang];

      document.getElementById('welcomeText').innerText = t.welcome;
      document.getElementById('startBtnText').innerText = t.startBtn;
      document.getElementById('lblBgColor').innerText = t.lblBgColor;
      document.getElementById('lblBtnColor').innerText = t.lblBtnColor;
      document.getElementById('lblLang').innerText = t.lblLang;
      document.getElementById('titleLetters').innerText = t.titleLetters;
      document.getElementById('titleTyping').innerText = t.titleTyping;
      document.getElementById('descTyping').innerText = t.descTyping;
      document.getElementById('titleWords').innerText = t.titleWords;
      document.getElementById('footerText').innerText = t.footer;

      renderWords();
    }

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2"></path>';
      } else {
        themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
    });

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
        settingsMenu.classList.remove('active');
      }
    });

    bgColorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });

    btnColorPicker.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--btn-color', e.target.value);
    });

    langSelect.addEventListener('change', (e) => {
      updateLanguage(e.target.value);
    });

    startBtn.addEventListener('click', () => {
      landingScreen.style.display = 'none';
      dashboardScreen.classList.add('active');
      window.scrollTo(0, 0);
    });

    speakTypeBtn.addEventListener('click', () => {
      const val = typingInput.value.trim();
      if (val) playAudio(val);
    });

    renderLetters();
    renderWords();
  </script>
</body>
</html>
